<div class="container-fluid">
  <div class="row">
    <div class="col-lg-8">
      <div class="toolbar mb-3 d-flex flex-wrap gap-2 align-items-center" *ngIf="ready">
        <div class="btn-group">
          <button type="button" class="btn" [ngClass]="currentView === 'front' ? 'btn-success' : 'btn-secondary'" (click)="changeView('front')">Front</button>
          <button type="button" class="btn" [ngClass]="currentView === 'back' ? 'btn-success' : 'btn-secondary'" (click)="changeView('back')">Back</button>
        </div>

        <button type="button" class="btn btn-outline-primary" (click)="randomize()">🎲 Randomize</button>
        <button type="button" class="btn btn-primary" (click)="saveTemplate()">Save</button>

        <div class="btn-group">
          <button type="button" class="btn btn-outline-secondary" (click)="downloadPng('front')">PNG Front</button>
          <button type="button" class="btn btn-outline-secondary" (click)="downloadPng('back')">PNG Back</button>
          <button type="button" class="btn btn-outline-secondary" (click)="downloadPdf()">PDF</button>
        </div>

        <span class="text-success ms-2" *ngIf="statusMessage">{{ statusMessage }}</span>
      </div>

      <p class="text-muted" *ngIf="!ready">Loading card…</p>

      <div class="canvas-stage">
        <div class="canvas-host" [class.d-none]="!ready || currentView !== 'front'">
          <canvas #frontCanvas></canvas>
        </div>
        <div class="canvas-host" [class.d-none]="!ready || currentView !== 'back'">
          <canvas #backCanvas></canvas>
        </div>
      </div>
    </div>

    <div class="col-lg-4" *ngIf="ready">
      <div class="edit-panel p-3">
        <label>Card Name</label>
        <input type="text" class="form-control mb-3" [(ngModel)]="template.name" />

        <label>Card Background</label>
        <input type="color" class="form-control form-control-color mb-3" [(ngModel)]="bgColor" />

        <hr />

        <ng-container *ngIf="selectedObject; else noSelection">
          <h5>Selected Object</h5>

          <ng-container *ngIf="selectedIsText">
            <label>Text</label>
            <textarea class="form-control mb-2" rows="2" [(ngModel)]="textValue"></textarea>

            <label>Font Size</label>
            <input type="range" min="8" max="48" class="form-range" [(ngModel)]="fontSize" />

            <label>Font Color</label>
            <input type="color" class="form-control form-control-color" [(ngModel)]="fontColor" />

            <label>Text Alignment</label>
            <select class="form-control mb-2" [(ngModel)]="textAlign">
              <option value="left">Left</option>
              <option value="center">Center</option>
              <option value="right">Right</option>
            </select>
          </ng-container>

          <ng-container *ngIf="selectedIsImage">
            <label>Replace Image</label>
            <input type="file" accept="image/*" class="form-control mb-2" (change)="onImageFileChange($event)" />
          </ng-container>

          <label>Rotation</label>
          <input type="range" min="0" max="360" class="form-range" [(ngModel)]="rotation" />

          <div class="btn-group mt-2 w-100">
            <button type="button" class="btn btn-outline-secondary" (click)="bringToFront()">Bring to Front</button>
            <button type="button" class="btn btn-outline-secondary" (click)="sendToBack()">Send to Back</button>
          </div>
          <button type="button" class="btn btn-outline-danger mt-2 w-100" (click)="deleteSelected()">Delete Object</button>
        </ng-container>

        <ng-template #noSelection>
          <p class="text-muted">Click an object on the card to edit it.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
